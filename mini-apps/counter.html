<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Counter</title>

    <style>
      .main {
        background: #e8f4f8;

        width: 80vw;
      }

      h1 {
        text-align: center;
        color: #4a6572;
      }

      #counter-num {
        display: block;
        text-align: center;
        font-size: 50px;
        font-weight: bold;
        background: #b8e1fc;
        color: #2c3e50;
        border: 2px solid #7fb3d5;
        margin: 2px 0 4%;
      }

      .btn-container {
        display: flex;
        justify-content: space-evenly;
        width: 50;
      }

      .btn {
        margin: 0 20px 0 20px;
        width: 100%;
        height: 30px;
        background: #95adbe;
        color: #f5f9ff;
        transition: background-color 0.25s;
      }

      .btn:hover {
        background: #7c9eb3;
        transform: translateY(-2px);
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="main">
      <h1>Counter:</h1>

      <p id="counter-num">0</p>
      <!-- <label id="counter-num">0</label> -->

      <div class="btn-container">
        <button id="btn-decrement" class="btn">Decrease</button>

        <button id="btn-reset" class="btn">Reset</button>

        <button id="btn-increment" class="btn">Increase</button>
      </div>
    </div>

    <script>
      const increment = document.getElementById("btn-increment");
      const decrement = document.getElementById("btn-decrement");
      const reset = document.getElementById("btn-reset");
      const displayValue = document.getElementById("counter-num");
      let counter = 0;

      increment.onclick = function () {
        counter++;
        displayValue.textContent = `${counter}`;
      };

      decrement.onclick = function () {
        counter--;
        displayValue.textContent = `${counter}`;
      };

      reset.onclick = function () {
        counter = 0;
        displayValue.textContent = `${counter}`;
      };
    </script>
  </body>
</html>
