<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculator</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        background-color: #f0f0f0;
      }

      #calculator {
        display: flex;
        flex-direction: column;
        align-items: center;
        font-family: Arial, sans-serif;
        background-color: hsl(0, 0%, 25%);
        border: 5px solid #db8916;
        border-radius: 15px;
        max-width: 500px;
        width: 100%;
        max-width: 500px;
        overflow: hidden;
        margin: 0;
      }

      #display {
        width: 85%;
        padding: 10px;
        margin: 10px;
        font-size: 5rem;
        text-align: left;
        color: white;
        border: none;
        background-color: hsl(0, 0%, 25%);
      }

      #keys {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 10px;
        padding: 25px;
        width: 100%;
        box-sizing: border-box;
        border-radius: 15px;
        background-color: hsl(0, 0%, 20%);
        margin: 0;
      }

      button {
        width: 100px;
        height: 100px;
        border-radius: 50%;
        border: 2px solid black;
        background-color: #4d4d4d;
        color: ghostwhite;
        font-size: 3rem;
        font-weight: bold;
        cursor: pointer;
        box-shadow: 5px 5px 0 0 rgb(37, 36, 36);
        transition:
          transform 0.1s ease,
          box-shadow 0.1s ease;
      }

      .operator-btn {
        background-color: #fe9f1a;
      }

      .operator-btn:hover {
        background-color: hsl(35, 99%, 65%);
      }

      .operator-btn:active {
        background-color: hsl(35, 100%, 50%);
      }

      button:hover {
        background-color: #6b6b6c;
      }

      button:active {
        transform: scale(0.97);
        box-shadow: 5px 5px 0 0 rgba(0, 0, 0, 0.3);
        background-color: hsl(0, 0%, 20%);
      }
    </style>
  </head>
  <body>
    <div id="calculator">
      <input id="display" readonly />
      <div id="keys">
        <button class="operator-btn" onclick="appendToDisplay('+')">+</button>
        <button onclick="appendToDisplay('7')">7</button>
        <button onclick="appendToDisplay('8')">8</button>
        <button onclick="appendToDisplay('9')">9</button>
        <button class="operator-btn" onclick="appendToDisplay('-')">-</button>
        <button onclick="appendToDisplay('4')">4</button>
        <button onclick="appendToDisplay('5')">5</button>
        <button onclick="appendToDisplay('6')">6</button>
        <button class="operator-btn" onclick="appendToDisplay('*')">*</button>
        <button onclick="appendToDisplay('1')">1</button>
        <button onclick="appendToDisplay('2')">2</button>
        <button onclick="appendToDisplay('3')">3</button>
        <button class="operator-btn" onclick="appendToDisplay('/')">/</button>
        <button onclick="appendToDisplay('0')">0</button>
        <button onclick="appendToDisplay('.')">.</button>
        <button onclick="calculate()">=</button>
        <button class="operator-btn" onclick="clearDisplay()">C</button>
      </div>
    </div>

    <script>
      const display = document.getElementById("display");

      function appendToDisplay(input) {
        display.value += input;
      }

      function clearDisplay() {
        display.value = "";
      }

      function calculate() {
        try {
          display.value = eval(display.value);
        } catch (error) {
          display.value = "Error";
        }
      }
    </script>
  </body>
</html>
