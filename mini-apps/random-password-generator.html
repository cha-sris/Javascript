<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Password Generator</title>
    <style>
        body{
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: monospace, sans-serif;
            line-height: 50px;
        }

        #password-display {
            padding: 10px 20px;
            border: 1px solid #6b6c6d;
            border-radius: 8px;
            display: flex;
            align-items: center;
        }

        #password {
            border: none;
            font-size: 2rem;
            color: #0c0d0f;
            width: 100%;
        }

        .button-group {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        button {
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 10px;
            border: none;
            cursor: pointer;
        }

        #regenerate-btn {
            background: url(../assets/password/pg-refresh-icon.svg) no-repeat center;

            width: 40px;
            height: 40px;
        }
        
        #copy-btn {
            background-color: #d61c47;
            color: #fafafb;
            padding: 10px 20px;
            margin-right: 0;
        }

        #copy-btn:hover {
            background-color: #c21b42;
        }

        /* Slider*/

        #password-length {
            border: none;
            font-size: 16px;
            font-weight: bold;
            max-width: 20px;
            background: none;
        }

        .range-labels {
            font-size: 16px;
            font-weight: 700;
        } 

        #slider-group {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 20px;
            background-color: #dbebdc;
        }

        #range-slider {
            accent-color: #dbebdc;
            
            width: 60%;
        }

        input[type="range"] {
            -webkit-appearance: none;
            background: transparent;
        }

        input[type="range"]::-webkit-slider-runnable-track {
            height: 8px;
            background: #080a0a;
            border-radius: 5px;
        }

        input[type="range"]::-webkit-slider-thumb  {
            -webkit-appearance: none;
            height: 20px;
            width: 20px;
            border-radius: 50%;
            background-color: white;
            margin-top: -6px;
            box-shadow: 0 2px 4px 0 rgba(0, 0, 0, 0.25);
            cursor: pointer;
        }


        /* conditions */

        .checkbox-grid {
            display: flex;
            flex-direction: row;
            justify-content: space-between;
        }

        input[type="checkbox"] {
            width: 15px;
            height: 15px;
        }


    </style>
</head>
<body>
    <form>
        <div id="password-display">
            <input type="text" id="password" value="baigaobgoua"/>

            <div class="button-group">            
                   <button type="button" id="regenerate-btn"></button>
                  <button type="button" id="copy-btn">copy</button>
            </div>

        </div>

        <div id="slider-group" class="form-group">
            <label for="range-slider" class="range-labels">Password Length</label>
            <input type="text"  id="password-length" value="8">
            <input type="range" id="range-slider" min="1" max="50" value="8" step="1">
        </div>

        <div id="conditions" class="form-group">
            <label class="range-labels">Characters Used</label>
           <div class="checkbox-grid">
                <div class="checkbox-item">
                    <input type="checkbox" id="upper-chk">
                    <label for="upper-chk">Uppercase</label>
                </div>
                <div class="checkbox-item">
                    <input type="checkbox" id="lower-chk">
                    <label for="lower-chk">Lowercase</label>
                </div>
                <div class="checkbox-item">
                    <input type="checkbox" id="number-chk">
                    <label for="number-chk">Numbers</label>
                </div>
                <div class="checkbox-item">
                    <input type="checkbox" id="symbol-chk">
                    <label for="symbol-chk">Symbols</label>
                </div>
           </div>
        </div>
    </form>
</body>
</html>
