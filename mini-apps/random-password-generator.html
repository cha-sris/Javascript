<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Password Generator</title>
    <style>
        body{
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #password-display {
            padding: 10px 20px;
            border: 1px solid #6b6c6d;
            border-radius: 8px;
            display: flex;
            align-items: center;
        }

        #password {
            border: none;
            font-size: 2rem;
            color: #0c0d0f;
            width: 100%;
        }

        .button-group {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        button {
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 10px;
            border: none;
            cursor: pointer;
        }

        #regenerate-btn {
            background: url(../assets/password/pg-refresh-icon.svg) no-repeat center;
            background-size: 24px;

            width: 40px;
            height: 40px;
        }
        
        #copy-btn {
            background-color: #d61c47;
            color: #fafafb;
            padding: 10px 20px;
            margin-right: 0;
        }

        #copy-btn:hover {
            background-color: #c21b42;
        }

        /* Slider */
        #password-length {
            max-width: 20px;
            font-size: 16px;
        }


        /* conditions */
        #conditions {
            font-size: 16px;
        }
    </style>
</head>
<body>
    <form>
        <div id="password-display">
            <input type="text" id="password" value="baigaobgoua"/>

            <div class="button-group">            
                   <button type="button" id="regenerate-btn"></button>
                  <button type="button" id="copy-btn">copy</button>
            </div>

        </div>

        <div id="slider-group" class="form-group">
            <label for="range-slider">Password Length</label>
            <input type="text"  id="password-length" value="9">
            <input type="range" name="" id="range-slider">
        </div>

        <div id="conditions" class="form-group">
            <label class="range-labels">Characters Used</label>
           <div class="checkbox-grid">
            <div class="checkbox-item">
                <input type="checkbox" id="upper-chk">
                <label for="upper-chk">Uppercase</label>
            </div>
            <div class="checkbox-item">
                <input type="checkbox" id="lower-chk">
                <label for="lower-chk">Lowercase</label>
            </div>
            <div class="checkbox-item">
                <input type="checkbox" id="number-chk">
                <label for="number-chk">Numbers</label>
            </div>
            <div class="checkbox-item">
                <input type="checkbox" id="symbol-chk">
                <label for="symbol-chk">Symbols</label>
            </div>
           </div>
        </div>
    </form>
</body>
</html>
