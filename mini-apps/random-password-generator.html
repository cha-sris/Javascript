<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Random Password Generator</title>
        <style>
            body{
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                font-family: monospace, sans-serif;
                padding-top: 40px;
                background-color: #f4f6f8;
            }
            
            form {
                display: flex;
                flex-direction: column;
                width: 100%;
                max-width: 800px;
            }
            
            #password-display {
            padding: 10px 20px;
            border: 1px solid #6b6c6d;
            border-radius: 8px;
            display: flex;
            align-items: center;
        }

        #password {
            border: none;
            font-size: 2rem;
            color: #0c0d0f;
            width: 100%;
            background: none;
        }

        .button-group {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        button {
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 10px;
            border: none;
            cursor: pointer;
        }

        #regenerate-btn {
            background: url(../assets/password/pg-refresh-icon.svg) no-repeat center;
            width: 40px;
            height: 40px;
        }
        
        #copy-btn {
            background-color: #d61c47;
            color: #fafafb;
            padding: 10px 20px;
        }
        
        #copy-btn:hover {
            background-color: #c21b42;
        }
        
        .form-group {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 30px;
            background-color: #dbebdc;
            padding: 20px;
            box-sizing: border-box;
        }

        /* Slider*/
        #slider-group {
            margin-top: 30px;
            border-radius: 10px 10px 0 0 ;
        }

        #password-length {
            border: none;
            font-size: 16px;
            font-weight: bold;
            width: 25px;
            background: none;
        }

        .range-labels {
            font-size: 16px;
            font-weight: 700;
            white-space: nowrap;
        } 

        input[type="range"] {
            -webkit-appearance: none;
            background: transparent;
            flex-grow: 1;
            cursor: pointer;
        }
        
        input[type="range"]::-webkit-slider-runnable-track {
            height: 8px;
            background: #080a0a;
            border-radius: 5px;
        }

        input[type="range"]::-webkit-slider-thumb  {
            -webkit-appearance: none;
            height: 20px;
            width: 20px;
            border-radius: 50%;
            background-color: white;
            margin-top: -6px;
            box-shadow: 0 2px 4px 0 rgba(0, 0, 0, 0.25);
        }

        /* Conditions Block */
        #conditions {
            border-radius: 0 0 10px 10px;
        }

        .checkbox-grid {
            display: flex;
            justify-content: space-between;
            flex-grow: 1;
            gap: 15px;
            flex-wrap: wrap;
            padding-left: 55px;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        input[type="checkbox"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
            accent-color: #111827;
        }


    </style>
</head>
<body>
    <form>
        <div id="password-display">
            <input type="text" id="password" value=""/>

            <div class="button-group">            
                   <button type="button" id="regenerate-btn"></button>
                  <button type="button" id="copy-btn">copy</button>
            </div>

        </div>

        <div id="slider-group" class="form-group">
            <label for="range-slider" class="range-labels">Password Length</label>
            <input type="text"  id="password-length" value="8">
            <input type="range" id="range-slider" min="1" max="50" value="8" step="1">
        </div>

        <div id="conditions" class="form-group">
            <label class="range-labels">Characters Used</label>
           <div class="checkbox-grid">
                <div class="checkbox-item">
                    <input type="checkbox" id="upper-chk" checked>
                    <label for="upper-chk">Uppercase</label>
                </div>
                <div class="checkbox-item">
                    <input type="checkbox" id="lower-chk" checked>
                    <label for="lower-chk">Lowercase</label>
                </div>
                <div class="checkbox-item">
                    <input type="checkbox" id="number-chk" checked>
                    <label for="number-chk">Numbers</label>
                </div>
                <div class="checkbox-item">
                    <input type="checkbox" id="symbol-chk" checked>
                    <label for="symbol-chk">Symbols</label>
                </div>
           </div>
        </div>
    </form>

    <script>
        const output = document.getElementById("password");

        const regenerateBtn = document.getElementById("regenerate-btn");
        const copyBtn = document.getElementById("copy-btn");

        const passLength = document.getElementById("password-length");
        const slider = document.getElementById("range-slider");

        const upperCheckBox= document.getElementById("upper-chk");
        const lowerCheckBox= document.getElementById("lower-chk");
        const numberCheckBox = document.getElementById("number-chk");
        const symbolCheckBox = document.getElementById("symbol-chk");
        const allCheckBoxes = document.querySelectorAll('#conditions input[type="checkbox"]');

        const uppercase = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
        const lowercase = "abcdefghijklmnopqrstuvwxyz";
        const numbers = "0123456789";
        const symbols = "`~!@#$%^&*()_+-=[]{};:,<>./?";

        let copyTimeout;


        allCheckBoxes.forEach(checkbox =>{
            checkbox.addEventListener("click", (event) => {
                const checkedCount = Array.from(allCheckBoxes).filter(box => box.checked).length;

                if(checkedCount === 0){
                    event.preventDefault();
                }
                else{
                    resetCopyButton();
                    generatePassword();
                }
            });
        });

        function generatePassword() {
            let lettersPool = "";

            if(upperCheckBox.checked)  {lettersPool += uppercase
            };
            if(lowerCheckBox.checked)  lettersPool += lowercase;
            if(numberCheckBox.checked) lettersPool += numbers;
            if(symbolCheckBox.checked) lettersPool += symbols;

            let generatedPassword = "";
            const targetLength = Number(slider.value);

            for(let i = 0; i < targetLength; i++) {
                const randomIndex = Math.floor(Math.random() * lettersPool.length);
                generatedPassword += lettersPool[randomIndex];
            }

            output.value = generatedPassword;
        }

        
        slider.addEventListener("input", () => {
            passLength.value = slider.value;
            resetCopyButton();
            generatePassword();
        });

        regenerateBtn.addEventListener("click", () => {
            resetCopyButton();
            generatePassword();
        });

            copyBtn.addEventListener("click", async  () => {
                try {
                    await navigator.clipboard.writeText(output.value);
                    copyBtn.textContent = "copied";
                    copyBtn.style.backgroundColor = "#2f613c";

                    clearTimeout(copyTimeout);

                    copyTimeout = setTimeout(resetCopyButton, 2000);
                } catch (error) {
                    console.error("Failed to copy: ", error);
                }
            });

            function resetCopyButton() {
                copyBtn.textContent = "copy";
                copyBtn.style.backgroundColor = "#cc1b46";
            }


        generatePassword();
    </script>
</body>
</html>
