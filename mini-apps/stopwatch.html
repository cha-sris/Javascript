<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stopwatch</title>
    <style>
      body {
        margin: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        background-color: hsl(0, 0%, 90%);
      }

      #myH1 {
        font-size: 4rem;
        font-family: "Segoe UI", sans-serif;
        color: hsl(0, 0%, 25%);
      }

      #container {
        display: flex;
        flex-direction: column;
        align-items: center;
        border: 5px solid;
        border-radius: 50px;
        padding: 30px;
        background-color: white;
      }

      #display {
        font-size: 5rem;
        font-family: monospace;
        font-weight: bold;
        color: hsl(0, 0%, 30%);
        text-shadow: 2px 2px 2px hsla(0, 0%, 0%, 75%);
        margin-bottom: 25px;
      }

      #controls button {
        font-size: 1.5rem;
        font-weight: bold;
        padding: 10px 20px;
        margin: 5px;
        min-width: 125px;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        color: white;
        transition: background-color 0.25s ease;
      }

      #start-btn {
        background-color: rgb(8, 166, 8);
      }

      #start-btn:hover {
        background-color: rgb(7, 140, 7);
      }

      #stop-btn {
        background-color: rgb(245, 34, 34);
      }

      #stop-btn:hover {
        background-color: rgb(200, 6, 6);
      }

      #reset-btn {
        background-color: rgb(246, 173, 39);
      }

      #reset-btn:hover {
        background-color: rgb(193, 127, 5);
      }
    </style>
  </head>
  <body>
    <h1 id="myH1">Stopwatch</h1>
    <div id="container">
      <div id="display">00:00:00:00</div>
      <div id="controls">
        <button id="start-btn" onclick="start()">Start</button>
        <button id="stop-btn" onclick="stop()">Stop</button>
        <button id="reset-btn" onclick="reset()">Reset</button>
      </div>
    </div>

    <script>
        const display = document.getElementById("display");
        let timer = null;
        let startTime = 0;
        let elapsedTime = 0;
        let isRunning = false;

        function start() {
            startTime = Date.now() - elapsedTime;
            timer = setInterval(update, 10);
            isRunning = true;
        }

        function stop() {
            if(isRunning){
                clearInterval(timer);
                elapsedTime = Date.now() - startTime;
                isRunning = false;
            }
        }

        function reset() {
            clearInterval(timer);
            startTime = 0;
            elapsedTime = 0;
            isRunning = false;
            display.textContent = "00:00:00:00";
        }

        function update() {
            const  currentTIme = Date.now();
            elapsedTime = currentTIme - startTime;

            let hours = Math.floor(elapsedTime / (1000 * 60 * 60));
            let minutes = Math.floor(elapsedTime / (1000 * 60) % 60);
            let seconds = Math.floor(elapsedTime / 1000 % 60);
            let miliseconds = Math.floor((elapsedTime % 1000) / 10 );

            hours = String(hours).padStart(2, "0");
            minutes = String(minutes).padStart(2, "0");
            seconds = String(seconds).padStart(2, "0");
            miliseconds = String(miliseconds).padStart(2, "0");

            display.textContent = `${hours}:${minutes}:${seconds}:${miliseconds}`;
        }
    </script>
  </body>
</html>
