<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dice Roller</title>
    <style>
      #container {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
      }

      .dice-img {
        width: 80px;
        height: 80px;
        margin: 5px;
        border-radius: 8px;
        box-shadow: 2px 2px 5px rgba(0, 0, 0, 0.2);
      }

      #img-container {
        display: flex;
        justify-content: center;
        flex-wrap: wrap;
        margin-top: 20px;
      }
    </style>
  </head>
  <body>
    <div id="container">
      <h1>Dice Roller</h1>

      <label for="die-num">Number of Dice: </label><br />
      <div id="input-container">
        <input
          type="number"
          id="die-num"
          pattern="[1-6]"
          min="1"
          max="6"
          title="Please enter a valid number between 1-6"
        />
        <button type="submit" id="btn-roll">Roll</button>
      </div>
      <div id="img-container"></div>
      <strong><p id="error-msg"></p></strong>
    </div>

    <script>
      const diceImages = {
        1: "../assets/dices/die1.png",
        2: "../assets/dices/die2.png",
        3: "../assets/dices/die3.png",
        4: "../assets/dices/die4.png",
        5: "../assets/dices/die5.png",
        6: "../assets/dices/die6.png",
      };

      document.getElementById("btn-roll").onclick = function () {
        let count = parseInt(document.getElementById("die-num").value);
        let diceContainer = document.getElementById("img-container");
        let errorMsg = document.getElementById("error-msg");

        // clear previous image
        diceContainer.innerHTML = "";
        errorMsg.innerHTML = "";

        if (count >= 1 && count <= 6) {
          for (let i = 0; i < count; i++) {
            let roll = Math.floor(Math.random() * 6) + 1;

            let img = document.createElement("img");
            img.src = diceImages[roll];
            img.alt = `Dice showing ${roll}`;
            img.className = "dice-img";

            diceContainer.appendChild(img);
          }
        } else {
          errorMsg.textContent = `Please enter a valid number between 1-6`;
        }
      };
    </script>
  </body>
</html>
