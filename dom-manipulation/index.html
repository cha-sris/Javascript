<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DOM Manipulation</title>
  </head>
  <body>
    <!-- element selector -->
    <!--getElementById -->
    <h1 id="my-heading">Food R Us</h1>

    <!-- getElementByClassName -->
    <div class="fruits">Apple</div>
    <div class="fruits">Orange</div>
    <div class="fruits">Banana</div>

    <!-- getElementByTagName -->
    <h4>Root Vegetables</h4>
    <ul>
      <li>Beets</li>
      <li>Carrot</li>
      <li>Potatoes</li>
    </ul>

    <h4>Non-Root Vegetables</h4>
    <ul>
      <li>Broccoli</li>
      <li>Celery</li>
      <li>Onions</li>
    </ul>

    <script src="selectors/element-selectors.js"></script>
  </body>
</html>
